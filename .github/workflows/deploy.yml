name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      # public/data.enc is committed as ciphertext. The plaintext record and the
      # password never leave the workstation, so CI needs no secrets at all.
      - name: Confirm nothing readable shipped
        run: |
          if [ ! -f dist/data.enc ]; then
            echo "::error::dist/data.enc is missing — run 'npm run data' locally and commit it."
            exit 1
          fi
          if grep -rqil -e 'dorian' -e 'switchgear' -e '3fconstruction' dist/assets dist/index.html; then
            echo "::error::Readable project content found in the bundle. Refusing to deploy."
            exit 1
          fi
          echo "Bundle clean: the record ships only as ciphertext."

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
